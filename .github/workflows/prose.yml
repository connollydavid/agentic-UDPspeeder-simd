name: Prose

# The spine obeys the prose rule it publishes (plan/0038): authored markdown carries
# zero prose tropes. `host-lifecycle prose .` is host-lint's `--docs` engine run
# in-process; it scans this repo's own tracked markdown (submodule files are gitlinks,
# not walked) and exits non-zero on any flag or warning.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from .env, the one place this host records the tools it
      # runs (call/0007), so the CI verdict and the local one cannot disagree. The
      # rev pinned inline here before was v0.30.1 and had drifted twenty releases
      # behind, which reddened this lane over two words its newer engine accepts.
      - name: Install host-lifecycle (pinned in .env)
        run: ./tools/install-tools.sh host-lifecycle
      - name: Prose gate (zero tropes in authored docs)
        run: |
          . ./.env
          "$HOST_LIFECYCLE" prose .
