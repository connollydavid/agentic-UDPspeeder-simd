name: apk feed

# A signed apk repository for udpspeeder-simd on OpenWrt 25.12, served from
# GitHub Pages.
#
# Only udpspeeder-simd is published. The stock udpspeeder is OpenWrt's own
# package and installable from the official feed already, so shipping our build
# of it beside theirs would add a second answer to a question that has one.
#
# apk only, and one release line. OpenWrt 24.10 and earlier use opkg, whose
# packages and index are a different format signed a different way; serving
# both means maintaining two of everything. 25.12 defaults to apk, which is
# where this points.
#
# This exists because udpspeeder-simd is in no feed until openwrt/packages
# #29901 merges. Once it does, the official feed is the better answer and this
# should be retired rather than left running beside it.

on:
  workflow_dispatch:
    inputs:
      release:
        description: OpenWrt release line to build against
        default: "25.12"
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write

concurrency:
  group: apk-feed
  cancel-in-progress: false

env:
  PKG_REPO: https://github.com/connollydavid/packages.git
  SIMD_BRANCH: udpspeeder-simd
  RELEASE: ${{ inputs.release || '25.12' }}

jobs:
  matrix:
    name: Read the architecture map
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.read.outputs.arches }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          json=$(awk -F'\t' '/^#/ || NF < 4 { next }
          { printf "%s{\"arch\":\"%s\",\"target\":\"%s\"}", sep, $1, $2; sep="," }' \
            .github/scripts/arch-map.tsv)
          echo "arches={\"include\":[$json]}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.arch }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.arches) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Fetch the package
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "$SIMD_BRANCH" "$PKG_REPO" feed
          git -C feed sparse-checkout set net/udpspeeder-simd
          mkdir -p localfeed/net
          cp -r feed/net/udpspeeder-simd localfeed/net/

      - name: Download the ${{ env.RELEASE }} SDK for ${{ matrix.target }}
        run: |
          idx="https://downloads.openwrt.org/releases"
          ver=$(wget -qO- "$idx/" \
            | grep -oE "\"${RELEASE}\.[0-9]+(-rc[0-9]+)?/\"" \
            | tr -d '"/' | sort -V | tail -1)
          if [ -z "$ver" ]; then echo "FAIL  no $RELEASE release found"; exit 1; fi
          base="$idx/$ver/targets/${{ matrix.target }}"
          sdk=$(wget -qO- "$base/sha256sums" | grep -oE 'openwrt-sdk[^*]+\.tar\.zst' | head -1)
          wget -qO sdk.tar.zst "$base/$sdk"
          mkdir sdk && tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Build
        run: |
          cd sdk
          echo "src-link localfeed $GITHUB_WORKSPACE/localfeed" > feeds.conf
          ./scripts/feeds update localfeed
          ./scripts/feeds install -a -p localfeed
          make defconfig
          echo CONFIG_PACKAGE_udpspeeder-simd=m >> .config
          make defconfig
          make package/feeds/localfeed/udpspeeder-simd/compile -j"$(nproc)"

      - name: Collect
        run: |
          mkdir -p out
          find sdk/bin -name 'udpspeeder-simd*.apk' -exec cp {} out/ \;
          if [ -z "$(ls -A out)" ]; then
            echo "FAIL  the build produced no apk for ${{ matrix.arch }}"
            exit 1
          fi
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: out/

  index:
    name: Sign the index and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: apk-*

      # apk mkndx signs with an EC prime256v1 key, the same shape OpenWrt
      # generates for its own builds. The private half never leaves the secret
      # and the public half is published beside the index, because a client
      # cannot verify the feed without it.
      - name: Take the signing key
        env:
          KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "FAIL  APK_SIGNING_KEY is not set; the feed cannot be signed"
            echo "      generate one with:"
            echo "        openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem"
            echo "        openssl ec -in private-key.pem -pubout -out public-key.pem"
            exit 1
          fi
          printf '%s' "$KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          echo "public key:"; cat public-key.pem

      - name: Get apk
        run: |
          sudo apt-get update && sudo apt-get install -y wget zstd
          # apk-tools from the SDK that built these, so the index format matches
          idx="https://downloads.openwrt.org/releases"
          ver=$(wget -qO- "$idx/" | grep -oE '"25\.12\.[0-9]+(-rc[0-9]+)?/"' \
            | tr -d '"/' | sort -V | tail -1)
          base="$idx/$ver/targets/x86/64"
          sdk=$(wget -qO- "$base/sha256sums" | grep -oE 'openwrt-sdk[^*]+\.tar\.zst' | head -1)
          wget -qO sdk.tar.zst "$base/$sdk"
          mkdir sdk && tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          (cd sdk && make package/system/apk/host/compile -j"$(nproc)")

      # One index per architecture, because a client asks for its own and apk
      # will not read another's.
      - name: Build and sign an index per architecture
        run: |
          set -euo pipefail
          apk=$(find sdk/staging_dir/host/bin -name apk -type f | head -1)
          [ -x "$apk" ] || { echo "FAIL  no apk host tool"; exit 1; }
          mkdir -p site
          cp public-key.pem site/
          for d in collected/apk-*; do
            arch=${d#collected/apk-}
            mkdir -p "site/$arch"
            cp "$d"/*.apk "site/$arch/"
            (cd "site/$arch" && "$GITHUB_WORKSPACE/$apk" mkndx \
                --sign "$GITHUB_WORKSPACE/private-key.pem" \
                --output packages.adb *.apk)
            echo "ok    $arch: $(ls "site/$arch"/*.apk | wc -l) package(s) indexed"
          done
          rm -f private-key.pem

      - name: Write the landing page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset=utf-8>
          <title>udpspeeder-simd apk feed</title>
          <h1>udpspeeder-simd, OpenWrt 25.12</h1>
          <p>An interim feed. Once
          <a href="https://github.com/openwrt/packages/pull/29901">#29901</a>
          merges, install from the official feed instead.</p>
          <pre>
          wget -O /etc/apk/keys/udpspeeder-simd.pem \
            https://connollydavid.github.io/agentic-UDPspeeder-simd/apk/public-key.pem

          echo "https://connollydavid.github.io/agentic-UDPspeeder-simd/apk/$(apk --print-arch)" \
            >> /etc/apk/repositories

          apk update &amp;&amp; apk add udpspeeder-simd
          </pre>
          HTML

      # Pages here is served from the gh-pages branch, and mdbook.yml owns its
      # root. Publishing through the Actions artifact route would switch the
      # Pages source and take the book offline, so this writes into a
      # subdirectory of the same branch and leaves everything else alone.
      - name: Publish under /apk on gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: apk
          keep_files: false
