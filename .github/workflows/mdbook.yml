name: mdBook

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the host-lifecycle tool
        # Only the publisher submodule; allium/specula are not needed to build docs.
        run: git submodule update --init tools/host-lifecycle
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the publisher
        run: cargo build --release --manifest-path tools/host-lifecycle/Cargo.toml
      - name: Generate the book (lifecycle order; every room)
        # `book` writes book.toml (src = mdBook/src, build-dir = mdBook/out) plus the
        # page tree; `--check` fails the build unless every room with source renders a
        # page (it reads the committed .host-software, never the un-materialized
        # worktrees).
        run: |
          HL=tools/host-lifecycle/target/release/host-lifecycle
          "$HL" book .
          "$HL" book --check .
      - name: Build site
        run: mdbook build
      - name: Resolve the book mount
        id: mount
        # A non-default `book-mount` publishes the book under a sub-path and keeps the
        # surrounding site; the root default publishes at the branch root. The tool owns
        # the normalisation, so the workflow reads the value rather than parsing the stamp.
        run: |
          HL=tools/host-lifecycle/target/release/host-lifecycle
          MOUNT="$("$HL" book --print-mount .)"
          if [ "$MOUNT" = "/" ]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
          else
            echo "dir=${MOUNT#/}" >> "$GITHUB_OUTPUT"
          fi
      # keep_files at every mount, unlike the reference workflow, which keeps files
      # only under a sub-path. The default is to delete everything that is not in
      # publish_dir, and the apk feed lives at /apk on this branch: at the root mount
      # the reference setting would remove it silently, visible only to whoever tried
      # to install from it.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mdBook/out
          destination_dir: ${{ steps.mount.outputs.dir }}
          keep_files: true
