name: qemu packet test

# Authentic runtime coverage for both OpenWrt packages, on every architecture the
# buildbot publishes rather than the five that OpenWrt's own CI runtime-tests.
# Each job builds both packages against the current snapshot SDK, then runs a
# tunnel under qemu-user and requires a payload to survive the round trip.
#
# The architecture list is data, in .github/scripts/arch-map.tsv, so adding a
# target is an edit to that file rather than to this workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: [main]
    paths:
      - .github/workflows/qemu-packet-test.yml
      - .github/scripts/packet-test.sh
      - .github/scripts/stage-sysroot.sh
      - .github/scripts/arch-map.tsv
      - .github/scripts/isa-check.sh

permissions:
  contents: read

env:
  PKG_REPO: https://github.com/connollydavid/packages.git
  SIMD_BRANCH: udpspeeder-simd
  UDPSPEEDER_BRANCH: udpspeeder-update-20260731

jobs:
  matrix:
    name: Read the architecture map
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.read.outputs.arches }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          # Each architecture is swept against both lines: the release the feed
          # serves, and main, so a break in OpenWrt's tree shows up here before
          # it reaches a release rather than after.
          json=$(awk -F'\t' -v rels="25.12 main" '
          /^#/ || NF < 4 { next }
          {
            isa = (NF >= 5 ? $5 : "-")
            n = split(rels, r, " ")
            for (i = 1; i <= n; i++) {
              printf "%s{\"arch\":\"%s\",\"target\":\"%s\",\"qemu\":\"%s\"," \
                     "\"cpu\":\"%s\",\"isa\":\"%s\",\"release\":\"%s\"}", \
                sep, $1, $2, $3, $4, isa, r[i]; sep=","
            }
          }' .github/scripts/arch-map.tsv)
          echo "arches={\"include\":[$json]}" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.arch }} (${{ matrix.release }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.arches) }}
    steps:
      - uses: actions/checkout@v7

      # qemu-user, not qemu-user-static: the static package installs the
      # emulators as qemu-<arch>-static, and arch-map.tsv names them unsuffixed.
      # The emulator is invoked by path here, so nothing needs binfmt.
      - name: Install the emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user zstd
          for q in $(awk -F'\t' '!/^#/ && NF>=4 {print $3}' .github/scripts/arch-map.tsv | sort -u); do
            command -v "$q" >/dev/null || { echo "FAIL  $q missing after install"; exit 1; }
          done

      - name: Fetch both packages from the fork
        run: |
          mkdir -p localfeed/net
          git clone --depth 1 --filter=blob:none --sparse \
            -b "$SIMD_BRANCH" "$PKG_REPO" simd
          git -C simd sparse-checkout set net/udpspeeder-simd
          cp -r simd/net/udpspeeder-simd localfeed/net/
          git clone --depth 1 --filter=blob:none --sparse \
            -b "$UDPSPEEDER_BRANCH" "$PKG_REPO" ups
          git -C ups sparse-checkout set net/udpspeeder
          cp -r ups/net/udpspeeder localfeed/net/

      - name: Download the ${{ matrix.release }} SDK for ${{ matrix.target }}
        run: |
          if [ "${{ matrix.release }}" = main ]; then
            base="https://downloads.openwrt.org/snapshots/targets/${{ matrix.target }}"
          else
            idx="https://downloads.openwrt.org/releases"
            # newest point release or rc on the chosen line
            ver=$(wget -qO- "$idx/" \
              | grep -oE '"${{ matrix.release }}\.[0-9]+(-rc[0-9]+)?/"' \
              | tr -d '"/' | sort -V | tail -1)
            if [ -z "$ver" ]; then
              echo "FAIL  no ${{ matrix.release }} release found"; exit 1
            fi
            echo "release line ${{ matrix.release }} resolves to $ver"
            base="$idx/$ver/targets/${{ matrix.target }}"
          fi
          sdk=$(wget -qO- "$base/sha256sums" | grep -oE 'openwrt-sdk[^*]+\.tar\.zst' | head -1)
          echo "SDK: $sdk"
          wget -qO sdk.tar.zst "$base/$sdk"
          mkdir sdk && tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Build both packages
        run: |
          cd sdk
          echo "src-link localfeed $GITHUB_WORKSPACE/localfeed" > feeds.conf
          ./scripts/feeds update localfeed
          ./scripts/feeds install -a -p localfeed
          make defconfig
          echo CONFIG_PACKAGE_UDPspeeder=m >> .config
          echo CONFIG_PACKAGE_udpspeeder-simd=m >> .config
          make defconfig
          make package/feeds/localfeed/udpspeeder/compile -j"$(nproc)"
          make package/feeds/localfeed/udpspeeder-simd/compile -j"$(nproc)"

      - name: Stage a target sysroot
        run: .github/scripts/stage-sysroot.sh sdk sysroot

      - name: Hold the binaries to the target instruction set
        if: matrix.isa != '-'
        run: |
          objdump=$(ls sdk/staging_dir/toolchain-*/bin/*-objdump | head -1)
          rc=0
          for pkg in udpspeeder udpspeeder-simd; do
            # spe asserts a path only the simd package has; holding the stock
            # package to it would fail on something it never claimed
            if [ "${{ matrix.isa }}" = spe ] && [ "$pkg" != udpspeeder-simd ]; then
              continue
            fi
            # newest wins: a reused SDK can hold build dirs from earlier versions,
            # and picking the first match can hand back a stale binary
            bin=$(find sdk/build_dir -path "*/.pkgdir/*/usr/bin/$pkg" -type f \
              -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
            [ -n "$bin" ] || { echo "no binary built for $pkg" >&2; rc=1; continue; }
            .github/scripts/isa-check.sh --binary "$bin" \
              --expect "${{ matrix.isa }}" --objdump "$objdump" || rc=1
          done
          exit $rc

      # The sweep builds a package for every published architecture and proves
      # each one runs. Discarding them afterwards means a failure cannot be
      # opened, and anyone wanting to try one on real hardware has to rebuild
      # the SDK to get back what this job already had. Keeping them is not
      # distribution: a run artifact expires, carries no signature, and is not
      # a feed. The signed package comes from OpenWrt once the PR merges.
      - name: Keep the packages this run verified
        if: always()
        run: |
          mkdir -p out
          find sdk/bin -name '*.apk' -o -name '*.ipk' 2>/dev/null | while read -r p; do
            case "$(basename "$p")" in udpspeeder*|UDPspeeder*) cp "$p" out/ ;; esac
          done
          ls -l out/ || echo "no package files found under sdk/bin"

      - name: Upload them
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.release }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: warn

      - name: Pass packets through a tunnel
        run: |
          rc=0
          port=31000
          for pkg in udpspeeder udpspeeder-simd; do
            # newest wins: a reused SDK can hold build dirs from earlier versions,
            # and picking the first match can hand back a stale binary
            bin=$(find sdk/build_dir -path "*/.pkgdir/*/usr/bin/$pkg" -type f \
              -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
            if [ -z "$bin" ]; then
              echo "no binary built for $pkg" >&2
              rc=1
              continue
            fi
            .github/scripts/packet-test.sh \
              --binary "$bin" \
              --sysroot sysroot \
              --qemu "${{ matrix.qemu }}" \
              --cpu "${{ matrix.cpu }}" \
              --base-port "$port" || rc=1
            port=$((port + 100))
          done
          exit $rc
