# Reference workflow: prove the software's build is reproducible (the production
# anchor). Software initiated under the methodology MUST reproduce; migrated software
# may carry a `repro-exempt = call/NNNN` case decision, which `--verify-build` warns
# on and skips. Replace the toolchain step with your component's pinned toolchain.
name: Reproducible build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly drift check

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every step below is gated on a `.host-software` existing. The bare template
      # has no software to verify, so this job no-ops (success) on the template itself
      # and runs fully once a project records a component. `hashFiles` is empty when
      # the file is absent, so the guard is false on the template and true for adopters.

      # From .env (call/0007), not a cargo build of the tools/host-lifecycle submodule.
      # That submodule sat at v0.35.1, which parses only the retired `repro-exempt`
      # spelling and so read this project's `repro-waiver` lines as absent, reporting
      # an exempt component as DRIFT.
      - name: Install host-lifecycle (pinned in .env)
        if: hashFiles('.host-software') != ''
        run: ./tools/install-tools.sh host-lifecycle
      # --- Your software's pinned toolchain goes here (the `toolchain` you record in
      #     .host-software). E.g. a fixed compiler/SDK so the rebuild is deterministic.
      - name: Set up the pinned toolchain
        if: hashFiles('.host-software') != ''
        run: 'echo "Install the toolchain pinned in .host-software (project-specific)"'
      - name: Materialize the software (bare store + worktrees)
        if: hashFiles('.host-software') != ''
        run: |
          . ./.env
          "$HOST_LIFECYCLE" software --materialize .
      - name: Verify reproducibility (rebuild from the pin; compare the artifact)
        if: hashFiles('.host-software') != ''
        run: |
          . ./.env
          "$HOST_LIFECYCLE" software --verify-build .
